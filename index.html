<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Menu & Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <!-- Loading Overlay -->
  <div id="loading" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center gap-3">
    <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-slate-500 text-sm font-medium">Fetching fresh menu...</p>
  </div>

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="outlet-logo" src="" alt="" class="w-10 h-10 rounded-full object-cover bg-slate-100 hidden" />
        <div>
          <h1 id="outlet-name" class="font-bold text-slate-900 leading-tight">Loading...</h1>
          <p id="outlet-timing" class="text-xs text-slate-500"></p>
        </div>
      </div>
      
      <!-- Cart Trigger Button -->
      <button onclick="toggleCartModal(true)" class="relative p-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-medium transition flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span class="text-sm font-bold" id="cart-btn-text">Cart (0)</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-6 space-y-8">

    <!-- Banners Slider -->
    <section id="banners-container" class="hidden overflow-x-auto flex gap-4 scrollbar-none snap-x pb-2">
      <!-- Injected dynamically -->
    </section>

    <!-- Special Offers Grid -->
    <section id="offers-section" class="hidden">
      <h2 class="text-lg font-bold mb-3 text-slate-900 flex items-center gap-2">
        <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i> Special Offers
      </h2>
      <div id="offers-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Injected dynamically -->
      </div>
    </section>

    <!-- Controls: Category Pills & Filters -->
    <section class="space-y-4">
      <div class="flex items-center justify-between gap-4 overflow-x-auto pb-2">
        <!-- Category Buttons -->
        <div id="categories-container" class="flex gap-2">
          <button onclick="filterCategory('all')" class="category-btn active px-4 py-2 rounded-full text-sm font-semibold bg-amber-500 text-white shadow-sm border border-transparent">
            All Items
          </button>
        </div>

        <!-- Veg Only Toggle -->
        <label class="flex items-center gap-2 cursor-pointer bg-white px-3 py-2 rounded-full border border-slate-200 text-sm font-medium shrink-0 shadow-sm">
          <input type="checkbox" id="veg-toggle" onchange="renderMenu()" class="sr-only peer" />
          <span class="w-3 h-3 rounded-full border-2 border-green-600 flex items-center justify-center p-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-green-600"></span>
          </span>
          <span class="text-slate-600 peer-checked:text-green-700">Veg Only</span>
        </label>
      </div>
    </section>

    <!-- Menu Items Grid -->
    <section class="space-y-4">
      <h2 class="text-xl font-bold text-slate-900">Our Menu</h2>
      <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Injected dynamically -->
      </div>
    </section>
  </main>

  <!-- Cart Modal Slide-over -->
  <div id="cart-modal" class="fixed inset-0 z-40 hidden">
    <!-- Backdrop -->
    <div onclick="toggleCartModal(false)" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>

    <!-- Drawer -->
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col z-10">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-amber-500"></i> Your Order
        </h3>
        <button onclick="toggleCartModal(false)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Cart Items List -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
        <!-- Injected dynamically -->
      </div>

      <!-- Checkout Footer -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
        <div class="flex justify-between font-bold text-lg text-slate-900">
          <span>Total:</span>
          <span id="cart-total-price">₹0.00</span>
        </div>
        <button onclick="placeOrder()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-center transition">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    // Replace with your dynamic Supabase Edge Function URL
    const FUNCTION_URL = "https://qxqnwfcljizyscrqkntd.supabase.co/functions/v1/public_website";

    // Application State
    let state = {
      outlet: null,
      categories: [],
      banners: [],
      offers: [],
      menu: [],
      cart: {}, // Format: { menu_item_id: { item, qty } }
      selectedCategory: 'all'
    };

    // --- INITIALIZATION ---
    async function init() {
      try {
        const res = await fetch(FUNCTION_URL);
        if (!res.ok) throw new Error("Failed to fetch menu data.");
        
        const data = await res.json();
        state.outlet = data.outlet;
        state.categories = data.categories;
        state.banners = data.banners;
        state.offers = data.offers;
        state.menu = data.menu;

        renderOutletDetails();
        renderBanners();
        renderOffers();
        renderCategories();
        renderMenu();

      } catch (err) {
        alert("Error loading menu: " + err.message);
      } finally {
        document.getElementById("loading").classList.add("hidden");
        lucide.createIcons();
      }
    }

    // --- RENDER FUNCTIONS ---
    function renderOutletDetails() {
      if (!state.outlet) return;
      document.title = state.outlet.name;
      document.getElementById("outlet-name").innerText = state.outlet.name;
      
      if (state.outlet.opens_at && state.outlet.closes_at) {
        document.getElementById("outlet-timing").innerText = `Open: ${state.outlet.opens_at.slice(0, 5)} - ${state.outlet.closes_at.slice(0, 5)}`;
      }
      
      if (state.outlet.logo_url) {
        const logo = document.getElementById("outlet-logo");
        logo.src = state.outlet.logo_url;
        logo.classList.remove("hidden");
      }
    }

    function renderBanners() {
      if (!state.banners.length) return;
      const container = document.getElementById("banners-container");
      container.classList.remove("hidden");
      
      container.innerHTML = state.banners.map(b => `
        <div class="snap-center shrink-0 w-80 md:w-96 h-40 rounded-2xl overflow-hidden relative shadow-sm">
          <img src="${b.img_url}" alt="${b.title || ''}" class="w-full h-full object-cover"/>
          ${b.title ? `<div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex items-end p-4">
            <h4 class="text-white font-bold">${b.title}</h4>
          </div>` : ''}
        </div>
      `).join('');
    }

    function renderOffers() {
      if (!state.offers.length) return;
      document.getElementById("offers-section").classList.remove("hidden");
      const container = document.getElementById("offers-container");

      container.innerHTML = state.offers.map(o => `
        <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200/60 p-4 rounded-2xl flex gap-4 items-center shadow-sm">
          ${o.img_url ? `<img src="${o.img_url}" class="w-16 h-16 rounded-xl object-cover shrink-0"/>` : ''}
          <div>
            <h4 class="font-bold text-amber-950">${o.title}</h4>
            <p class="text-xs text-amber-800 mt-1">${o.description || ''}</p>
          </div>
        </div>
      `).join('');
    }

    function renderCategories() {
      const container = document.getElementById("categories-container");
      const catButtons = state.categories.map(c => `
        <button onclick="filterCategory(${c.id})" id="cat-btn-${c.id}" class="category-btn px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 shrink-0 shadow-sm transition">
          ${c.emoji || ''} ${c.name}
        </button>
      `).join('');
      
      container.innerHTML += catButtons;
    }

    function renderMenu() {
      const menuGrid = document.getElementById("menu-grid");
      const vegOnly = document.getElementById("veg-toggle").checked;

      // Filter Logic
      const filtered = state.menu.filter(item => {
        const matchesCategory = state.selectedCategory === 'all' || item.category_id === state.selectedCategory;
        const matchesVeg = !vegOnly || item.is_veg;
        return matchesCategory && matchesVeg;
      });

      if (!filtered.length) {
        menuGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">No items available in this selection.</div>`;
        return;
      }

      menuGrid.innerHTML = filtered.map(item => {
        const cartQty = state.cart[item.menu_item_id]?.qty || 0;
        const firstImg = Array.isArray(item.images) && item.images.length ? item.images[0] : null;

        return `
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex gap-4 items-start relative ${!item.in_stock ? 'opacity-60' : ''}">
            
            <!-- Item Info -->
            <div class="flex-1 space-y-1">
              <div class="flex items-center gap-2">
                <!-- Veg Indicator Dot -->
                <span class="w-3 h-3 rounded-full border-2 ${item.is_veg ? 'border-green-600' : 'border-red-600'} flex items-center justify-center p-0.5">
                  <span class="w-1.5 h-1.5 rounded-full ${item.is_veg ? 'bg-green-600' : 'bg-red-600'}"></span>
                </span>
                ${item.is_bestseller ? `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">BESTSELLER</span>` : ''}
              </div>

              <h3 class="font-bold text-slate-900 leading-snug">${item.name}</h3>
              <p class="text-xs text-slate-500 line-clamp-2">${item.description || ''}</p>

              <!-- Pricing -->
              <div class="pt-2 flex items-baseline gap-2">
                <span class="font-bold text-slate-900">₹${item.pricing.final_price}</span>
                ${item.pricing.discount_percentage > 0 ? `
                  <span class="text-xs text-slate-400 line-through">₹${item.pricing.original_price}</span>
                  <span class="text-xs font-semibold text-green-600">${item.pricing.discount_percentage}% OFF</span>
                ` : ''}
              </div>
            </div>

            <!-- Image & Add Button -->
            <div class="w-24 flex flex-col items-center gap-2 shrink-0">
              ${firstImg ? `<img src="${firstImg}" class="w-24 h-20 rounded-xl object-cover bg-slate-100"/>` : '<div class="w-24 h-20 bg-slate-100 rounded-xl"></div>'}
              
              ${!item.in_stock ? `
                <span class="text-xs text-red-500 font-bold py-1">Out of Stock</span>
              ` : cartQty === 0 ? `
                <button onclick="updateCart(${item.menu_item_id}, 1)" class="w-full py-1.5 bg-amber-50 text-amber-600 border border-amber-200 hover:bg-amber-100 rounded-lg text-xs font-bold transition">
                  ADD
                </button>
              ` : `
                <div class="flex items-center justify-between w-full bg-amber-500 text-white rounded-lg px-2 py-1 text-xs font-bold">
                  <button onclick="updateCart(${item.menu_item_id}, -1)">-</button>
                  <span>${cartQty}</span>
                  <button onclick="updateCart(${item.menu_item_id}, 1)">+</button>
                </div>
              `}
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // --- CART LOGIC ---
    function updateCart(menuItemId, change) {
      const item = state.menu.find(m => m.menu_item_id === menuItemId);
      if (!item) return;

      const currentQty = state.cart[menuItemId]?.qty || 0;
      const newQty = currentQty + change;

      if (newQty <= 0) {
        delete state.cart[menuItemId];
      } else {
        state.cart[menuItemId] = { item, qty: newQty };
      }

      renderMenu();
      renderCartDrawer();
    }

    function renderCartDrawer() {
      const container = document.getElementById("cart-items");
      const cartKeys = Object.keys(state.cart);

      let totalItems = 0;
      let totalPrice = 0;

      if (cartKeys.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">Your cart is empty.</div>`;
      } else {
        container.innerHTML = cartKeys.map(key => {
          const { item, qty } = state.cart[key];
          const itemTotal = item.pricing.final_price * qty;
          totalItems += qty;
          totalPrice += itemTotal;

          return `
            <div class="pt-3 flex items-center justify-between">
              <div>
                <h4 class="font-semibold text-sm text-slate-900">${item.name}</h4>
                <p class="text-xs text-slate-500">₹${item.pricing.final_price} × ${qty}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-sm text-slate-900">₹${itemTotal.toFixed(2)}</span>
                <div class="flex items-center gap-2 bg-slate-100 rounded-lg px-2 py-1 text-xs font-bold">
                  <button onclick="updateCart(${item.menu_item_id}, -1)" class="px-1 text-slate-600">-</button>
                  <span>${qty}</span>
                  <button onclick="updateCart(${item.menu_item_id}, 1)" class="px-1 text-slate-600">+</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById("cart-btn-text").innerText = `Cart (${totalItems})`;
      document.getElementById("cart-total-price").innerText = `₹${totalPrice.toFixed(2)}`;
    }

    function filterCategory(catId) {
      state.selectedCategory = catId;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-white');
        btn.classList.add('bg-white', 'text-slate-600');
      });

      const activeBtn = catId === 'all' ? document.querySelector('.category-btn') : document.getElementById(`cat-btn-${catId}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-600');
        activeBtn.classList.add('bg-amber-500', 'text-white');
      }

      renderMenu();
    }

    function toggleCartModal(show) {
      const modal = document.getElementById("cart-modal");
      if (show) {
        modal.classList.remove("hidden");
        renderCartDrawer();
      } else {
        modal.classList.add("hidden");
      }
    }

    function placeOrder() {
      if (!Object.keys(state.cart).length) {
        alert("Add items to your cart before proceeding!");
        return;
      }
      alert("Cart ready for checkout integration!");
    }

    // Startup
    init();
  </script>
</body>
</html>
