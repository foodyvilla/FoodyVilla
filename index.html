<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Menu & Ordering</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Swiper.js CSS (For Sliders) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Custom scrollbar for category tabs */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-28 min-h-screen">

  <!-- Loading Screen -->
  <div id="loading" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center gap-3">
    <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-slate-600 text-sm font-semibold tracking-wide">Loading delicious menu...</p>
  </div>

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="outlet-logo" src="" alt="Restaurant Logo" class="w-10 h-10 rounded-full object-cover bg-slate-100 hidden ring-2 ring-amber-500/20" />
        <div>
          <h1 id="outlet-name" class="font-bold text-slate-900 leading-tight">Restaurant Name</h1>
          <p id="outlet-timing" class="text-xs text-slate-500 flex items-center gap-1">
            <i data-lucide="clock" class="w-3 h-3 text-amber-500"></i> Open Now
          </p>
        </div>
      </div>
      
      <!-- Cart Trigger Button -->
      <button onclick="toggleCartModal(true)" class="relative bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-sm flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span class="text-sm font-bold" id="cart-btn-text">Cart (0)</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-6 space-y-10">

    <!-- Hero Banner Slider -->
    <section id="banners-section" class="hidden">
      <div class="swiper bannerSwiper rounded-2xl overflow-hidden shadow-md">
        <div class="swiper-wrapper" id="banners-wrapper">
          <!-- Banner Slides dynamically injected -->
        </div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next !text-white !w-8 !h-8 after:!text-sm bg-black/30 hover:bg-black/50 rounded-full"></div>
        <div class="swiper-button-prev !text-white !w-8 !h-8 after:!text-sm bg-black/30 hover:bg-black/50 rounded-full"></div>
      </div>
    </section>

    <!-- Offers & Promotions Slider -->
    <section id="offers-section" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i> Exclusive Offers
        </h2>
      </div>
      <div class="swiper offerSwiper">
        <div class="swiper-wrapper" id="offers-wrapper">
          <!-- Offer Slides dynamically injected -->
        </div>
      </div>
    </section>

    <!-- Bestsellers Section Slider -->
    <section id="bestsellers-section" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="flame" class="w-5 h-5 text-amber-500"></i> Popular Bestsellers
        </h2>
      </div>
      <div class="swiper bestsellerSwiper">
        <div class="swiper-wrapper" id="bestsellers-wrapper">
          <!-- Bestseller items dynamically injected -->
        </div>
      </div>
    </section>

    <!-- Main Menu Area with Floating Filter Bar -->
    <section class="space-y-6 pt-2">
      <!-- Sticky Category Bar -->
      <div class="sticky top-16 z-20 bg-slate-50/95 backdrop-blur-md py-3 -mx-4 px-4 border-b border-slate-200/60 shadow-xs flex items-center justify-between gap-4">
        <!-- Horizontal Scrollable Categories -->
        <div id="categories-container" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
          <button onclick="filterCategory('all')" class="category-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-white shadow-xs shrink-0 transition">
            All Items
          </button>
          <!-- Injected dynamically -->
        </div>

        <!-- Veg Only Toggle Switch -->
        <label class="flex items-center gap-2 cursor-pointer bg-white px-3 py-2 rounded-xl border border-slate-200/80 text-xs md:text-sm font-semibold shrink-0 shadow-xs">
          <input type="checkbox" id="veg-toggle" onchange="renderMenu()" class="sr-only peer" />
          <span class="w-3.5 h-3.5 rounded-xs border-2 border-green-600 flex items-center justify-center">
            <span class="w-1.5 h-1.5 rounded-full bg-green-600"></span>
          </span>
          <span class="text-slate-700 peer-checked:text-green-700 select-none">Veg Only</span>
        </label>
      </div>

      <!-- Menu Grid -->
      <div>
        <h2 class="text-xl font-bold text-slate-900 mb-4" id="menu-title">Full Menu</h2>
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Menu Items dynamically injected -->
        </div>
      </div>
    </section>
  </main>

  <!-- Cart Slide-Over Modal -->
  <div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <div onclick="toggleCartModal(false)" class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity"></div>
    
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col z-10">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-amber-500"></i> Your Cart
        </h3>
        <button onclick="toggleCartModal(false)" class="p-2 hover:bg-slate-200/60 rounded-xl text-slate-400 hover:text-slate-600 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Items List -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
        <!-- Injected dynamically -->
      </div>

      <!-- Total & Action Footer -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
        <div class="flex justify-between font-bold text-lg text-slate-900">
          <span>Total:</span>
          <span id="cart-total-price">₹0.00</span>
        </div>
        <button onclick="placeOrder()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-xl font-bold text-center transition shadow-md">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <!-- Swiper.js Script (Slider Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // --- CONFIGURATION ---
    const FUNCTION_URL = "https://<your-project-ref>.supabase.co/functions/v1/get-public-website-data";

    let state = {
      outlet: null,
      categories: [],
      banners: [],
      offers: [],
      menu: [],
      cart: {},
      selectedCategory: 'all'
    };

    // --- INIT ---
    async function init() {
      try {
        const res = await fetch(FUNCTION_URL);
        if (!res.ok) throw new Error("Failed to load restaurant data.");
        
        const data = await res.json();
        state.outlet = data.outlet;
        state.categories = data.categories;
        state.banners = data.banners;
        state.offers = data.offers;
        state.menu = data.menu;

        renderOutletHeader();
        renderBanners();
        renderOffers();
        renderBestsellers();
        renderCategories();
        renderMenu();

      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        document.getElementById("loading").classList.add("hidden");
        lucide.createIcons();
      }
    }

    // --- RENDERERS ---
    function renderOutletHeader() {
      if (!state.outlet) return;
      document.title = state.outlet.name;
      document.getElementById("outlet-name").innerText = state.outlet.name;
      
      if (state.outlet.opens_at && state.outlet.closes_at) {
        document.getElementById("outlet-timing").innerHTML = `
          <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-500"></i> ${state.outlet.opens_at.slice(0, 5)} - ${state.outlet.closes_at.slice(0, 5)}
        `;
      }
      if (state.outlet.logo_url) {
        const logo = document.getElementById("outlet-logo");
        logo.src = state.outlet.logo_url;
        logo.classList.remove("hidden");
      }
    }

    // 1. Banner Slider
    function renderBanners() {
      if (!state.banners || !state.banners.length) return;
      document.getElementById("banners-section").classList.remove("hidden");

      const wrapper = document.getElementById("banners-wrapper");
      wrapper.innerHTML = state.banners.map(b => `
        <div class="swiper-slide">
          <div class="relative w-full h-44 sm:h-64 md:h-80 bg-slate-900">
            <img src="${b.img_url}" class="w-full h-full object-cover opacity-90"/>
            ${b.title ? `
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end p-6">
                <h3 class="text-white text-lg md:text-2xl font-bold">${b.title}</h3>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');

      // Initialize Banner Swiper
      new Swiper(".bannerSwiper", {
        autoplay: { delay: 4000, disableOnInteraction: false },
        loop: true,
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
      });
    }

    // 2. Special Offers Slider
    function renderOffers() {
      if (!state.offers || !state.offers.length) return;
      document.getElementById("offers-section").classList.remove("hidden");

      const wrapper = document.getElementById("offers-wrapper");
      wrapper.innerHTML = state.offers.map(o => `
        <div class="swiper-slide !w-72">
          <div class="bg-gradient-to-br from-amber-500/10 to-orange-500/10 border border-amber-300/40 p-3.5 rounded-2xl flex gap-3 items-center">
            ${o.img_url ? `<img src="${o.img_url}" class="w-14 h-14 rounded-xl object-cover shrink-0 shadow-xs"/>` : ''}
            <div>
              <h4 class="font-bold text-amber-950 text-sm leading-tight">${o.title}</h4>
              <p class="text-xs text-amber-800/80 mt-1 line-clamp-2">${o.description || ''}</p>
            </div>
          </div>
        </div>
      `).join('');

      // Initialize Offers Carousel
      new Swiper(".offerSwiper", {
        slidesPerView: "auto",
        spaceBetween: 12,
        freeMode: true
      });
    }

    // 3. Bestsellers Slider
    function renderBestsellers() {
      const bestsellers = state.menu.filter(i => i.is_bestseller);
      if (!bestsellers.length) return;
      document.getElementById("bestsellers-section").classList.remove("hidden");

      const wrapper = document.getElementById("bestsellers-wrapper");
      wrapper.innerHTML = bestsellers.map(item => {
        const firstImg = Array.isArray(item.images) && item.images.length ? item.images[0] : '';
        return `
          <div class="swiper-slide !w-44">
            <div class="bg-white p-2.5 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col justify-between h-full">
              <div>
                <div class="relative w-full h-28 rounded-xl overflow-hidden mb-2 bg-slate-100">
                  ${firstImg ? `<img src="${firstImg}" class="w-full h-full object-cover"/>` : ''}
                  <span class="absolute top-1.5 left-1.5 bg-amber-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-md shadow-xs">BESTSELLER</span>
                </div>
                <h4 class="font-bold text-xs text-slate-900 line-clamp-1">${item.name}</h4>
                <p class="font-black text-slate-900 text-xs mt-0.5">₹${item.pricing.final_price}</p>
              </div>
              <button onclick="updateCart(${item.menu_item_id}, 1)" class="w-full mt-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold transition">
                + ADD
              </button>
            </div>
          </div>
        `;
      }).join('');

      new Swiper(".bestsellerSwiper", {
        slidesPerView: "auto",
        spaceBetween: 12,
        freeMode: true
      });
    }

    // 4. Categories Tabs
    function renderCategories() {
      const container = document.getElementById("categories-container");
      container.innerHTML += state.categories.map(c => `
        <button onclick="filterCategory(${c.id})" id="cat-btn-${c.id}" class="category-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-700 border border-slate-200/80 hover:bg-slate-100 shrink-0 transition shadow-xs flex items-center gap-1.5">
          <span>${c.emoji || ''}</span>
          <span>${c.name}</span>
        </button>
      `).join('');
    }

    // 5. Main Menu Grid
    function renderMenu() {
      const menuGrid = document.getElementById("menu-grid");
      const vegOnly = document.getElementById("veg-toggle").checked;

      const filtered = state.menu.filter(item => {
        const matchCategory = state.selectedCategory === 'all' || item.category_id === state.selectedCategory;
        const matchVeg = !vegOnly || item.is_veg;
        return matchCategory && matchVeg;
      });

      if (!filtered.length) {
        menuGrid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 font-medium">No items match your selected preferences.</div>`;
        return;
      }

      menuGrid.innerHTML = filtered.map(item => {
        const cartQty = state.cart[item.menu_item_id]?.qty || 0;
        const firstImg = Array.isArray(item.images) && item.images.length ? item.images[0] : null;

        return `
          <div class="bg-white p-4 rounded-2xl border border-slate-200/70 shadow-xs flex gap-3.5 items-start relative ${!item.in_stock ? 'opacity-50' : ''}">
            <div class="flex-1 space-y-1">
              <div class="flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-xs border-2 ${item.is_veg ? 'border-green-600' : 'border-red-600'} flex items-center justify-center">
                  <span class="w-1.5 h-1.5 rounded-full ${item.is_veg ? 'bg-green-600' : 'bg-red-600'}"></span>
                </span>
                ${item.is_bestseller ? `<span class="bg-amber-100 text-amber-800 text-[9px] font-bold px-1.5 py-0.5 rounded-md">BESTSELLER</span>` : ''}
              </div>

              <h3 class="font-bold text-slate-900 leading-snug text-sm">${item.name}</h3>
              <p class="text-xs text-slate-500 line-clamp-2">${item.description || ''}</p>

              <div class="pt-2 flex items-baseline gap-2">
                <span class="font-bold text-slate-900 text-base">₹${item.pricing.final_price}</span>
                ${item.pricing.discount_percentage > 0 ? `
                  <span class="text-xs text-slate-400 line-through">₹${item.pricing.original_price}</span>
                  <span class="text-xs font-semibold text-green-600">${item.pricing.discount_percentage}% OFF</span>
                ` : ''}
              </div>
            </div>

            <!-- Image & Add/Quantity Actions -->
            <div class="w-24 flex flex-col items-center gap-2 shrink-0">
              ${firstImg ? `<img src="${firstImg}" class="w-24 h-20 rounded-xl object-cover bg-slate-100 shadow-xs"/>` : '<div class="w-24 h-20 bg-slate-100 rounded-xl"></div>'}
              
              ${!item.in_stock ? `
                <span class="text-xs text-red-500 font-bold py-1">Out of Stock</span>
              ` : cartQty === 0 ? `
                <button onclick="updateCart(${item.menu_item_id}, 1)" class="w-full py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition shadow-xs">
                  ADD
                </button>
              ` : `
                <div class="flex items-center justify-between w-full bg-amber-500 text-white rounded-xl px-2 py-1 text-xs font-bold shadow-xs">
                  <button onclick="updateCart(${item.menu_item_id}, -1)" class="px-1">-</button>
                  <span>${cartQty}</span>
                  <button onclick="updateCart(${item.menu_item_id}, 1)" class="px-1">+</button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // --- ACTIONS ---
    function updateCart(menuItemId, change) {
      const item = state.menu.find(m => m.menu_item_id === menuItemId);
      if (!item) return;

      const currentQty = state.cart[menuItemId]?.qty || 0;
      const newQty = currentQty + change;

      if (newQty <= 0) {
        delete state.cart[menuItemId];
      } else {
        state.cart[menuItemId] = { item, qty: newQty };
      }

      renderMenu();
      renderCartDrawer();
    }

    function renderCartDrawer() {
      const container = document.getElementById("cart-items");
      const cartKeys = Object.keys(state.cart);

      let totalItems = 0;
      let totalPrice = 0;

      if (cartKeys.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-400 text-sm">Your cart is currently empty.</div>`;
      } else {
        container.innerHTML = cartKeys.map(key => {
          const { item, qty } = state.cart[key];
          const itemTotal = item.pricing.final_price * qty;
          totalItems += qty;
          totalPrice += itemTotal;

          return `
            <div class="pt-3 flex items-center justify-between">
              <div>
                <h4 class="font-semibold text-sm text-slate-900">${item.name}</h4>
                <p class="text-xs text-slate-500">₹${item.pricing.final_price} × ${qty}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-sm text-slate-900">₹${itemTotal.toFixed(2)}</span>
                <div class="flex items-center gap-2 bg-slate-100 rounded-lg px-2 py-1 text-xs font-bold">
                  <button onclick="updateCart(${item.menu_item_id}, -1)" class="px-1 text-slate-600">-</button>
                  <span>${qty}</span>
                  <button onclick="updateCart(${item.menu_item_id}, 1)" class="px-1 text-slate-600">+</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById("cart-btn-text").innerText = `Cart (${totalItems})`;
      document.getElementById("cart-total-price").innerText = `₹${totalPrice.toFixed(2)}`;
    }

    function filterCategory(catId) {
      state.selectedCategory = catId;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
      });

      const activeBtn = catId === 'all' ? document.querySelector('.category-btn') : document.getElementById(`cat-btn-${catId}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-700');
        activeBtn.classList.add('bg-amber-500', 'text-white');
      }

      renderMenu();
    }

    function toggleCartModal(show) {
      const modal = document.getElementById("cart-modal");
      if (show) {
        modal.classList.remove("hidden");
        renderCartDrawer();
      } else {
        modal.classList.add("hidden");
      }
    }

    function placeOrder() {
      if (!Object.keys(state.cart).length) {
        alert("Please add items to your cart first!");
        return;
      }
      alert("Order ready for Razorpay checkout!");
    }

    init();
  </script>
</body>
</html>
